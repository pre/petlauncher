[package]
name = "petlauncher"
description = "The petlauncher program: the launcher window and the command line, with GTK 4 and libadwaita"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "petlauncher"
path = "src/main.rs"

[dependencies]
# The features give the API of the runtime on GNOME 46 (Ubuntu 24.04):
# GTK 4.14, libadwaita 1.5 and GLib 2.80. Do not select newer versions.
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
async-channel = "2"
gtk = { package = "gtk4", version = "0.11", features = ["gnome_46"] }
# The program does not download: the Launcher does, on its own thread.
petlauncher-calc = { path = "../petlauncher-calc", default-features = false }
petlauncher-config = { path = "../petlauncher-config" }
petlauncher-core = { path = "../petlauncher-core" }
petlauncher-dict = { path = "../petlauncher-dict" }
petlauncher-gnome = { path = "../petlauncher-gnome" }
petlauncher-providers = { path = "../petlauncher-providers" }

[dev-dependencies]
tempfile = "3"
